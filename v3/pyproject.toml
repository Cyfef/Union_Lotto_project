[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "union-lotto-predictor-v3"
version = "3.0.0"
description = "Bayesian posterior predictive model for Double Color Ball"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cyfef"}]
dependencies = []

[project.scripts]
union-lotto-v3 = "union_lotto_v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

