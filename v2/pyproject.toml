[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "union-lotto-predictor-v2"
version = "2.0.0"
description = "A leakage-safe statistical feature model for Double Color Ball"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cyfef"}]
dependencies = []

[project.scripts]
union-lotto-v2 = "union_lotto_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

